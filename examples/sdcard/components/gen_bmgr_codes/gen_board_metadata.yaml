version: 1
board: esp32_p4_devkit
chip: esp32p4

devices:
  sdcard_power_ctrl:
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - gpio_sd_power

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 43
      cmd: 44
      d0: 39
      d1: 40
      d2: 41
      d3: 42
      cd: 45

  audio_dac:
    type: audio_codec
    peripherals:
    - i2s_audio_out
    - i2c_audio

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_audio

  boot_button:
    type: button
    sub_type: gpio
    peripherals:
    - gpio_boot_button

  display_lcd:
    type: display_lcd
    sub_type: dsi
    peripherals:
    - ldo_mipi
    - dsi_display

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_touch
    dependencies:
      espressif/esp_lcd_touch_st7123: ^1.0.2

  lcd_brightness:
    type: gpio_ctrl
    peripherals:
    - gpio_backlight

  camera:
    type: camera
    sub_type: csi
    peripherals:
    - i2c_camera
    - ldo_mipi
    io:
      reset_io: 11
      xclk_pin: 21

peripherals:
  i2c_audio:
    type: i2c
    role: master
    io:
      sda_io_num: 28
      scl_io_num: 25

  i2c_camera:
    type: i2c
    role: master
    io:
      sda_io_num: 9
      scl_io_num: 10

  i2c_touch:
    type: i2c
    role: master
    io:
      sda_io_num: 49
      scl_io_num: 48

  i2s_audio_out:
    type: i2s
    role: master
    format: tdm-out
    io:
      mclk: 26
      bclk: 27
      ws: 30
      dout: 31
      din: 29

  i2s_audio_in:
    type: i2s
    role: master
    format: tdm-in
    io:
      mclk: 26
      bclk: 27
      ws: 30
      dout: 31
      din: 29

  gpio_boot_button:
    type: gpio
    role: io
    io:
      pin: 35

  gpio_backlight:
    type: gpio
    role: io
    io:
      pin: 24

  gpio_sd_power:
    type: gpio
    role: io
    io:
      pin: 4

  ldo_mipi:
    type: ldo

  dsi_display:
    type: dsi
board_path: <ESPP4-A>/components/espp4_a_boards/esp32_p4_devkit
